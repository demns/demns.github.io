<script>
// Purrfect Shot - deterministic puck physics, shared by the game and the level checker.
// Only + - * / and Math.sqrt are used inside the simulation, so every browser gives the same result.
const SIM = (() => {
  const DT = 1 / 120;          // physics step (s)
  const MAX_TIME = 10;         // a shot ends after 10 s
  const R = 2.5;               // puck radius (internal px)
  const VMAX = 330;            // full-power speed (px/s)
  const ICE_DECEL = 80;         // constant slow-down on ice (px/s^2): full power slides 680 px
  const STOP_SPEED = 4;        // below this the puck has stopped (px/s)
  const BOUNCE = 0.85;         // boards and blockers keep 85% of speed
  const ANGLE_STEPS = 1440;    // 0.25 degree aim steps
  const POWER_MIN = 10, POWER_MAX = 100;
  const RINK = { x0: 8, y0: 8, x1: 312, y1: 172, r: 28 };
  const NET_HALF = 14, NET_DEPTH = 10;
  const PASS_SPEED = 260;      // a teammate passes along its arrow at this speed
  const BUMP = 1.25;           // springboards send the puck off faster (capped at VMAX)
  const SLUSH_DECEL = 600;     // slush brakes hard: a full-speed puck stops within about 90 px of it
  const GLARE_DECEL = 22;      // glare ice slows it about 3.6x more gently
  const PI = 3.141592653589793;

  // ---- deterministic trigonometry (Taylor series on a reduced range) ----
  function sinSmall(x) { const x2 = x * x; return x * (1 - x2 / 6 * (1 - x2 / 20 * (1 - x2 / 42 * (1 - x2 / 72 * (1 - x2 / 110 * (1 - x2 / 156)))))); }
  function cosSmall(x) { const x2 = x * x; return 1 - x2 / 2 * (1 - x2 / 12 * (1 - x2 / 30 * (1 - x2 / 56 * (1 - x2 / 90 * (1 - x2 / 132))))); }
  // angle in quarter degrees 0..1439 (0 = right, 360 = down, screen y points down)
  const DIRS = new Array(ANGLE_STEPS);
  for (let i = 0; i < ANGLE_STEPS; i++) {
    const q = Math.floor(i / 360), r = i - q * 360;          // quadrant, remainder 0..359
    let c, s;
    if (r <= 180) { const t = r * (PI / 720); c = cosSmall(t); s = sinSmall(t); }
    else { const t = (360 - r) * (PI / 720); c = sinSmall(t); s = cosSmall(t); }
    // rotate by q * 90 degrees
    let x = c, y = s;
    for (let k = 0; k < q; k++) { const nx = -y, ny = x; x = nx; y = ny; }
    DIRS[i] = [x, y];
  }
  function dir(idx) { idx = ((idx % ANGLE_STEPS) + ANGLE_STEPS) % ANGLE_STEPS; return DIRS[idx]; }

  // ---- world building ----
  function seg(ax, ay, bx, by, kind, e) { return { ax, ay, bx, by, kind, e: e === undefined ? BOUNCE : e }; }

  function rinkSegments() {
    const { x0, y0, x1, y1, r } = RINK, pts = [], N = 7;
    // corner centres clockwise starting top-right
    const corners = [[x1 - r, y0 + r, -90], [x1 - r, y1 - r, 0], [x0 + r, y1 - r, 90], [x0 + r, y0 + r, 180]];
    for (const [cx, cy, start] of corners) {
      for (let k = 0; k <= N; k++) {
        const deg4 = (start + 90 * k / N) * 4;            // quarter degrees (may be fractional)
        const lo = Math.floor(deg4), f = deg4 - lo, a = dir(lo), b = dir(lo + 1);
        const vx = a[0] + (b[0] - a[0]) * f, vy = a[1] + (b[1] - a[1]) * f;
        const len = Math.sqrt(vx * vx + vy * vy);
        pts.push([cx + r * vx / len, cy + r * vy / len]);
      }
    }
    const segs = [];
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], q = pts[(i + 1) % pts.length];
      if (Math.abs(p[0] - q[0]) + Math.abs(p[1] - q[1]) > 1e-9) segs.push(seg(p[0], p[1], q[0], q[1], 'board'));
    }
    return segs;
  }

  // net: (x,y) = centre of the mouth, dir = way the opening faces: 'L','R','U','D'
  function netGeometry(n) {
    const inward = { L: [1, 0], R: [-1, 0], U: [0, 1], D: [0, -1] }[n.dir];
    const lat = [-inward[1], inward[0]];
    const P = (u, v) => [n.x + inward[0] * u + lat[0] * v, n.y + inward[1] * u + lat[1] * v];
    const m1 = P(0, -NET_HALF), m2 = P(0, NET_HALF), b1 = P(NET_DEPTH, -NET_HALF), b2 = P(NET_DEPTH, NET_HALF);
    return {
      inward, lat, m1, m2, b1, b2,
      segs: [seg(m1[0], m1[1], b1[0], b1[1], 'net', 0.6), seg(b1[0], b1[1], b2[0], b2[1], 'net', 0.3), seg(b2[0], b2[1], m2[0], m2[1], 'net', 0.6)],
    };
  }

  const CIRCLE_R = { snow: 6, rock: 6, goalie: 6, rival: 6, bumper: 6, mate: 6 };
  // surface patches: rectangle (w, h) or circle (r), centred on (x, y)
  function inShape(o, x, y) {
    if (o.w !== undefined) return Math.abs(x - o.x) <= o.w / 2 && Math.abs(y - o.y) <= o.h / 2;
    const dx = x - o.x, dy = y - o.y; return dx * dx + dy * dy <= o.r * o.r;
  }

  function build(level) {
    const w = { segs: rinkSegments(), circles: [], drifts: [], fish: [], yarn: [], surf: [], cracks: [], start: level.start, level };
    const net = netGeometry(level.net);
    w.net = net; w.segs.push(...net.segs);
    for (const o of level.objs || []) {
      if (o.t === 'snow' || o.t === 'rock' || o.t === 'goalie' || o.t === 'rival') w.circles.push({ x: o.x, y: o.y, r: o.r || CIRCLE_R[o.t], kind: o.t, e: BOUNCE });
      else if (o.t === 'bumper') w.segs.push(seg(o.x1, o.y1, o.x2, o.y2, 'bumper', BUMP)); // springboard: a flat bar that kicks the puck off faster
      else if (o.t === 'mate') w.circles.push({ x: o.x, y: o.y, r: o.r || CIRCLE_R.mate, kind: 'mate', e: BOUNCE, a: o.a, i: w.circles.filter(c => c.kind === 'mate').length });
      else if (o.t === 'slush' || o.t === 'glare') w.surf.push({ kind: o.t, x: o.x, y: o.y, w: o.w, h: o.h, r: o.r });
      else if (o.t === 'crack') w.cracks.push({ x: o.x, y: o.y, w: o.w, h: o.h, r: o.r });
      else if (o.t === 'bank') for (let i = 0; i < o.pts.length; i++) { const a = o.pts[i], b = o.pts[(i + 1) % o.pts.length]; w.segs.push(seg(a[0], a[1], b[0], b[1], 'bank', BOUNCE)); }
      else if (o.t === 'crate') {
        const hw = (o.w || 12) / 2, hh = (o.h || 12) / 2, x0 = o.x - hw, x1 = o.x + hw, y0 = o.y - hh, y1 = o.y + hh;
        w.segs.push(seg(x0, y0, x1, y0, 'crate'), seg(x1, y0, x1, y1, 'crate'), seg(x1, y1, x0, y1, 'crate'), seg(x0, y1, x0, y0, 'crate'));
      } else if (o.t === 'wall') w.segs.push(seg(o.x1, o.y1, o.x2, o.y2, 'wall'));
      else if (o.t === 'drift') w.drifts.push({ x: o.x, y: o.y, r: o.r || 9 });
      else if (o.t === 'yarn') w.yarn.push({ x: o.x, y: o.y });
    }
    for (const f of level.fish || []) w.fish.push({ x: f.x, y: f.y });
    return w;
  }

  // ---- shot state machine ----
  function startShot(w, angleIdx, power) {
    const d = dir(angleIdx), v = VMAX * Math.max(POWER_MIN, Math.min(POWER_MAX, power)) / 100;
    return { w, x: w.start.x, y: w.start.y, vx: d[0] * v, vy: d[1] * v, t: 0, steps: 0, done: false, end: null,
      fish: 0, fishCount: 0, yarn: 0, contacts: 0, goal: false, used: 0, inCrack: 0, crackN: [] };
  }

  // distance^2 from point C to segment P->Q
  function segDist2(px, py, qx, qy, cx, cy) {
    const dx = qx - px, dy = qy - py, l2 = dx * dx + dy * dy;
    let t = l2 > 0 ? ((cx - px) * dx + (cy - py) * dy) / l2 : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const ex = px + dx * t - cx, ey = py + dy * t - cy;
    return ex * ex + ey * ey;
  }

  // earliest hit of a moving circle (radius R) along d against a circle (cx,cy,rr)
  function hitCircle(px, py, dx, dy, cx, cy, rr) {
    const fx = px - cx, fy = py - cy, a = dx * dx + dy * dy;
    if (a === 0) return null;
    const b = fx * dx + fy * dy;
    if (b >= 0) return null;                 // moving away
    const c = fx * fx + fy * fy - rr * rr;
    if (c <= 0) { const l = Math.sqrt(fx * fx + fy * fy) || 1; return { t: 0, nx: fx / l, ny: fy / l }; }
    const disc = b * b - a * c;
    if (disc < 0) return null;
    const t = (-b - Math.sqrt(disc)) / a;
    if (t < 0 || t > 1) return null;
    const hx = fx + dx * t, hy = fy + dy * t, l = Math.sqrt(hx * hx + hy * hy) || 1;
    return { t, nx: hx / l, ny: hy / l };
  }

  function hitSegment(px, py, dx, dy, s) {
    const sx = s.bx - s.ax, sy = s.by - s.ay, L = Math.sqrt(sx * sx + sy * sy);
    const ux = sx / L, uy = sy / L;
    let nx = -uy, ny = ux;
    let dist0 = (px - s.ax) * nx + (py - s.ay) * ny;
    if (dist0 < 0) { nx = -nx; ny = -ny; dist0 = -dist0; }
    const dn = dx * nx + dy * ny;
    let best = null;
    if (dn < 0) {
      let t = (dist0 - R) / -dn;
      if (dist0 < R) t = 0;
      if (t <= 1) {
        const qx = px + dx * t, qy = py + dy * t, proj = (qx - s.ax) * ux + (qy - s.ay) * uy;
        if (proj >= 0 && proj <= L) best = { t, nx, ny };
      }
    }
    if (!best) {
      const h1 = hitCircle(px, py, dx, dy, s.ax, s.ay, R), h2 = hitCircle(px, py, dx, dy, s.bx, s.by, R);
      if (h1 && (!h2 || h1.t <= h2.t)) best = h1, best.end = 'a'; else if (h2) best = h2, best.end = 'b';
    }
    return best;
  }

  // advance one physics step; returns a list of events
  function step(st) {
    const ev = [];
    if (st.done) return ev;
    const w = st.w;
    let sp = Math.sqrt(st.vx * st.vx + st.vy * st.vy);
    let decel = ICE_DECEL;
    for (const s of w.surf) if (inShape(s, st.x, st.y)) decel = s.kind === 'slush' ? SLUSH_DECEL : GLARE_DECEL;
    const ns = sp - decel * DT;
    if (ns <= STOP_SPEED) { st.done = true; st.end = 'stop'; ev.push({ type: 'stop' }); return ev; }
    st.vx *= ns / sp; st.vy *= ns / sp;
    let remaining = 1;
    for (let iter = 0; iter < 6 && remaining > 0; iter++) {
      const dx = st.vx * DT * remaining, dy = st.vy * DT * remaining;
      let best = null, bestObj = null;
      for (const s of w.segs) {
        const h = hitSegment(st.x, st.y, dx, dy, s);
        if (h && (!best || h.t < best.t)) { best = h; bestObj = s; }
      }
      for (const c of w.circles) {
        const h = hitCircle(st.x, st.y, dx, dy, c.x, c.y, c.r + R);
        if (h && (!best || h.t < best.t)) { best = h; bestObj = c; }
      }
      const t = best ? best.t : 1;
      const nx2 = st.x + dx * t, ny2 = st.y + dy * t;
      // sensors along the travelled piece
      sensorCheck(st, st.x, st.y, nx2, ny2, ev);
      if (st.done) return ev;
      st.x = nx2; st.y = ny2;
      if (!best) break;
      // teammate: the first touch is a pass along its arrow
      if (bestObj.kind === 'mate' && !(st.used & (1 << bestObj.i))) {
        st.used |= 1 << bestObj.i;
        const d = dir(bestObj.a), off = bestObj.r + R + 0.01;
        st.x = bestObj.x + d[0] * off; st.y = bestObj.y + d[1] * off;
        st.vx = d[0] * PASS_SPEED; st.vy = d[1] * PASS_SPEED;
        st.contacts++;
        ev.push({ type: 'pass', kind: 'mate', i: bestObj.i, x: st.x, y: st.y });
        break;
      }
      // bounce
      const vn = st.vx * best.nx + st.vy * best.ny, e = bestObj.e;
      const speedIn = Math.sqrt(st.vx * st.vx + st.vy * st.vy);
      st.vx = (st.vx - 2 * vn * best.nx) * e; st.vy = (st.vy - 2 * vn * best.ny) * e;
      if (e > 1) { const s2 = Math.sqrt(st.vx * st.vx + st.vy * st.vy); if (s2 > VMAX) { st.vx *= VMAX / s2; st.vy *= VMAX / s2; } }
      st.x += best.nx * 1e-6; st.y += best.ny * 1e-6;
      st.contacts++;
      ev.push({ type: 'bounce', kind: bestObj.kind, x: st.x, y: st.y, nx: best.nx, ny: best.ny, speed: speedIn, post: bestObj.kind === 'net' && best.end !== undefined });
      remaining *= (1 - t);
      if (t === 0 && iter > 3) break;
    }
    // cracked ice: the first crossing cracks it, the second sinks the puck
    for (let i = 0; i < w.cracks.length; i++) {
      const inside = inShape(w.cracks[i], st.x, st.y), bit = 1 << i;
      if (inside && !(st.inCrack & bit)) {
        st.crackN[i] = (st.crackN[i] || 0) + 1;
        if (st.crackN[i] === 1) ev.push({ type: 'crack', i });
        else { st.done = true; st.end = 'sink'; ev.push({ type: 'sink', i }); st.inCrack |= bit; return ev; }
      }
      if (inside) st.inCrack |= bit; else st.inCrack &= ~bit;
    }
    st.t += DT; st.steps++;
    if (st.t >= MAX_TIME) { st.done = true; st.end = 'time'; ev.push({ type: 'stop' }); }
    return ev;
  }

  function sensorCheck(st, ax, ay, bx, by, ev) {
    const w = st.w;
    for (let i = 0; i < w.fish.length; i++) {
      if (st.fish & (1 << i)) continue;
      const f = w.fish[i], rr = 4 + R;
      if (segDist2(ax, ay, bx, by, f.x, f.y) <= rr * rr) { st.fish |= 1 << i; st.fishCount++; ev.push({ type: 'fish', i }); }
    }
    for (let i = 0; i < w.yarn.length; i++) {
      if (st.yarn & (1 << i)) continue;
      const f = w.yarn[i], rr = 3 + R;
      if (segDist2(ax, ay, bx, by, f.x, f.y) <= rr * rr) { st.yarn |= 1 << i; ev.push({ type: 'yarn', i }); }
    }
    for (const d of w.drifts) {
      if (segDist2(ax, ay, bx, by, d.x, d.y) <= d.r * d.r) {
        st.done = true; st.end = 'drift';
        // stop at the drift edge point closest along the path
        st.x = bx; st.y = by;
        ev.push({ type: 'drift' });
        return;
      }
    }
    // goal: the centre crosses the mouth line moving inward, between the posts
    const n = w.net, inx = n.inward[0], iny = n.inward[1];

  // ---------------- update ----------------

    if (G.overlay) { G.phaseT += dt; if (G.result) G.result.starT += dt; if (G.overlay === 'result' && G.phaseT >= ADVANCE_AFTER) nextLevel(); return; }

    if (G.hintShow > 0) G.hintShow -= dt;
    if (G.duckT > 0) G.duckT -= dt;
    if (G.rivalT > 0) G.rivalT -= dt;
    if (G.bumpT > 0) G.bumpT -= dt;

  function drawLevels() {
    const s = L.safe, pad = 4, b = Math.max(22, L.btn), n = viewWorld, wd = WORLDS[n - 1], open = worldOpen(n);

    }
    if (!best) best = { cols: 5, rows: 4, w: 30, h: 26 };
    const gw = best.cols * best.w + (best.cols - 1) * 4, gx = Math.round((L.SW - gw) / 2);

  function setupDialog() {
    const dlg = document.getElementById('dlg'), ta = document.getElementById('dlgCode'), msg = document.getElementById('dlgMsg');
    document.getElementById('dlgCopy').onclick = () => {
      ta.select();
      const done = () => { msg.textContent = T('copied'); };
      try { navigator.clipboard.writeText(ta.value).then(done, () => { document.execCommand('copy'); done(); }); } catch (e) { try { document.execCommand('copy'); done(); } catch (e2) {} }
    };
    document.getElementById('dlgLoad').onclick = () => {
      try {
        const v = ta.value.trim(); if (!v.startsWith('PS1:')) throw 0;
        const obj = JSON.parse(decodeURIComponent(escape(atob(v.slice(4)))));
        if (!obj || obj.v !== 1) throw 0;
        S = Object.assign(DEFAULT_SAVE(), obj); S.set = Object.assign(DEFAULT_SAVE().set, S.set || {}); save();
        AUDIO.setMusic(!!S.set.music); AUDIO.setSfx(!!S.set.sfx);

  // ---------------- main loop ----------------
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame); // keep the loop alive even if a frame throws
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
    if (layoutDirty) measure();
    update(dt);
    buttons = []; texts = [];
    const swn = sceneWorld();
    if (!sceneryCache || sceneryCache.wn !== swn) { sceneryCache = buildScenery(swn); sceneryCache.wn = swn; }
    sx = stageCtx; curLayer = stage; firstFlush = true;
    sx.setTransform(1, 0, 0, 1, 0, 0); sx.imageSmoothingEnabled = false;
    sx.drawImage(sceneryCache, 0, 0);
    if (scene === 'title') drawTitle();
    else if (scene === 'levels') drawLevels();
    else if (scene === 'settings') drawSettings();
    else if (scene === 'play') drawPlay();
    if (toast) {
      layer();
      const fsz = FS.body, w = Math.ceil(textW(toast.msg, fsz)) + 32, h = 22;
      const x = Math.round(L.SW / 2 - w / 2), y = Math.round(L.SH * 0.3 - (toast.t < 0.2 ? (0.2 - toast.t) * 60 : 0));
